# Caller workflow for the reference IMS app: ~15 lines instead of ~100.
name: ims-ci
on:
  push:
    branches: [main]
    paths: ["app/**", "infrastructure/**", ".github/workflows/**"]
  pull_request:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  app:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      working-directory: app
      image-name: acme-ims
  infra:
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      working-directory: infrastructure/examples/ims
      localstack-apply: true
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, infra]
    uses: ./.github/workflows/reusable-release.yml
    with:
      image-name: acme-ims
