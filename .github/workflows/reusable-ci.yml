# Reusable CI: lint -> test -> secret scan -> container build -> image scan
# Callers: uses: <org>/<repo>/.github/workflows/reusable-ci.yml@v1
name: reusable-ci
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: app
      python-version:
        type: string
        default: "3.12"
      image-name:
        type: string
        required: true
      coverage-threshold:
        type: number
        default: 80
      trivy-severity:
        type: string
        default: "HIGH,CRITICAL"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=src --cov-fail-under=${{ inputs.coverage-threshold }}

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ${{ inputs.image-name }}:${{ github.sha }} ${{ inputs.working-directory }}
      - name: Trivy filesystem scan (deps + IaC misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ inputs.trivy-severity }}
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ github.sha }}
          severity: ${{ inputs.trivy-severity }}
          exit-code: "1"
          ignore-unfixed: true
