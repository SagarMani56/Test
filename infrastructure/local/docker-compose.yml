services:
  localstack:
    image: localstack/localstack:3.8
    ports: ["4566:4566"]
    environment:
      # kms is required: DynamoDB server-side encryption (KMS) calls it during CreateTable.
      SERVICES: s3,dynamodb,kms,ec2,iam,logs,sts
      # Start services at boot instead of on first request. A slow first DynamoDB CreateTable
      # makes the Terraform provider retry and fail with "Table already exists".
      EAGER_SERVICE_LOADING: "1"
    healthcheck:
      # Keep this check simple: "is LocalStack answering?". Per-service readiness is checked by
      # scripts/wait-localstack.sh, which prints what it sees if something is wrong.
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
