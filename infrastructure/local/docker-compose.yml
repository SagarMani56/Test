services:
  localstack:
    image: localstack/localstack:3.8
    ports: ["4566:4566"]
    environment:
      SERVICES: s3,dynamodb,ec2,iam,logs,sts
      # Start every service at boot (DynamoDB Local is installed at startup) instead of on
      # first request - a slow first CreateTable makes the Terraform provider retry and then
      # fail with "ResourceInUseException: Table already exists".
      EAGER_SERVICE_LOADING: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"dynamodb\": ?\"running\"' && curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"s3\": ?\"running\"'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
